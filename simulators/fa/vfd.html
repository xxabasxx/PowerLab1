<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><script>(function(){if(location.protocol==='file:')return;try{if(window.self!==window.top||window.frameElement)return;}catch(e){return;}var p=location.pathname.replace(/\/$/,''),f=p.split('/').pop().replace(/\.html$/i,''),l=location.pathname.indexOf('/en/')!==-1?'en':'fa';if(f&&f!=='simulators'&&f!=='fa'&&f!=='en'){window.location.replace('/?circuit='+encodeURIComponent(f)+'&lang='+l);}})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">شبیه‌ساز درایور موتور AC (VFD)</title>
    <style>
        /* --- تمامی استایل‌ها دقیقا مشابه قالب طلایی --- */
        :root {
            --bg-color: #0a0f1d;
            --panel-bg: rgba(18, 26, 47, 0.75);
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --accent-gold: #ffb703;
            --accent-green: #2ed573;
            --accent-red: #ff4757;
            --text-color: #e2e8f0;
            --border-color: rgba(255, 255, 255, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; overflow-x: hidden; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 1.8rem; color: var(--accent-cyan); margin-bottom: 6px; text-shadow: 0 0 12px rgba(0, 242, 254, 0.3); }
        header p { font-size: 0.95rem; color: #94a3b8; }
        .main-container { display: grid; grid-template-columns: 320px 1fr; gap: 20px; width: 100%; max-width: 1300px; }
        @media (max-width: 950px) { .main-container { grid-template-columns: 1fr; } }
        .glass-panel { background: var(--panel-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .controls-sidebar { display: flex; flex-direction: column; gap: 16px; }
        .control-group { display: flex; flex-direction: column; gap: 6px; }
        .control-group label { font-size: 0.85rem; display: flex; justify-content: space-between; color: #cbd5e1; }
        .control-group label span.val { color: var(--accent-cyan); font-weight: bold; direction: ltr; }
        input[type="range"] { appearance: none; width: 100%; height: 6px; background: #1e293b; border-radius: 3px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent-cyan); cursor: pointer; box-shadow: 0 0 8px var(--accent-cyan); transition: transform 0.1s; }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
        .toggle-group { display: flex; background: #1e293b; border-radius: 8px; padding: 3px; gap: 4px; }
        .toggle-btn { flex: 1; padding: 8px; border: none; background: transparent; color: #94a3b8; font-size: 0.82rem; border-radius: 6px; cursor: pointer; transition: all 0.3s; }
        .toggle-btn.active { background: var(--accent-cyan); color: #0f172a; font-weight: bold; }
        .toggle-btn.alert.active { background: var(--accent-red); color: #fff; box-shadow: 0 0 10px var(--accent-red); }
        .simulation-area { display: flex; flex-direction: column; gap: 20px; }
        .canvas-container { position: relative; width: 100%; height: 440px; background: rgba(10, 15, 29, 0.6); border-radius: 12px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.05); }
        canvas { width: 100%; height: 100%; display: block; }
        .scopes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 650px) { .scopes-grid { grid-template-columns: 1fr; } }
        .scope-card { background: rgba(15, 23, 42, 0.8); border-radius: 10px; padding: 12px; border: 1px solid rgba(255, 255, 255, 0.08); }
        .scope-card h3 { font-size: 0.85rem; margin-bottom: 8px; color: #94a3b8; display: flex; align-items: center; gap: 6px; }
        .scope-card h3::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
        .scope-pwm h3::before { background: var(--accent-cyan); }
        .scope-out h3::before { background: var(--accent-gold); }
        .metrics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 5px; }
        .metric-card { background: rgba(255, 255, 255, 0.03); border-radius: 8px; padding: 10px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.05); }
        .metric-card .title { font-size: 0.75rem; color: #64748b; margin-bottom: 4px; }
        .metric-card .val { font-size: 1.05rem; font-weight: bold; color: var(--accent-cyan); direction: ltr; }
        .state-indicator { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px; background: rgba(255,255,255,0.04); border-radius: 8px; font-size: 0.85rem; font-weight: bold; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #64748b; }
        .status-dot.on { background: var(--accent-cyan); box-shadow: 0 0 10px var(--accent-cyan); }
        .status-dot.off { background: var(--accent-red); box-shadow: 0 0 10px var(--accent-red); }
    </style>
</head>
<body>

    <header>
        <h1 id="txt-title">شبیه‌ساز درایور موتور AC (VFD)</h1>
        <p id="txt-subtitle">کنترل سرعت موتور القایی با روش V/f از طریق رکتیفایر، لینک DC و اینورتر</p>
    </header>

    <div class="main-container">
        <!-- پنل تنظیمات -->
        <aside class="glass-panel controls-sidebar">
            <div class="control-group" style="display: none;">
                <label id="lbl-lang">زبان / Language:</label>
                <div class="toggle-group">
                    <button class="toggle-btn lang-btn active" id="btn-lang-fa" onclick="setLanguage('fa')">فارسی</button>
                    <button class="toggle-btn lang-btn" id="btn-lang-en" onclick="setLanguage('en')">English</button>
                </div>
            </div>

            <div class="control-group">
                <label id="lbl-flow">نوع جریان:</label>
                <div class="toggle-group">
                    <button class="toggle-btn active" id="btn-conv" onclick="setFlowMode('conv')">قراردادی (+ به -)</button>
                    <button class="toggle-btn" id="btn-elec" onclick="setFlowMode('elec')">الکترونی (- به +)</button>
                </div>
            </div>

            <div class="control-group">
                <label id="lbl-state">وضعیت درایو (Run/Stop):</label>
                <div class="toggle-group">
                    <button class="toggle-btn active" id="btn-run" onclick="setRunState(true)">روشن (RUN)</button>
                    <button class="toggle-btn alert" id="btn-stop" onclick="setRunState(false)">توقف (STOP)</button>
                </div>
            </div>

            <div class="control-group">
                <label><span id="lbl-freq">فرکانس هدف (Target Freq):</span> <span class="val" id="val-freq">50 Hz</span></label>
                <input type="range" id="slider-freq" min="5" max="60" value="50" step="1">
            </div>

            <div class="control-group">
                <label><span id="lbl-load">بار مکانیکی (Torque Load):</span> <span class="val" id="val-load">متوسط</span></label>
                <input type="range" id="slider-load" min="1" max="10" value="5" step="1">
            </div>

            <div class="state-indicator">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-text">حالت: موتور در حال چرخش</span>
            </div>

            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="title" id="lbl-outfreq">فرکانس خروجی</div>
                    <div class="val" id="m-outfreq">50.0 Hz</div>
                </div>
                <div class="metric-card">
                    <div class="title" id="lbl-rpm">سرعت موتور (RPM)</div>
                    <div class="val" id="m-rpm">1450</div>
                </div>
                <div class="metric-card">
                    <div class="title" id="lbl-outv">ولتاژ موتور (V_RMS)</div>
                    <div class="val" id="m-outv">380 V</div>
                </div>
                <div class="metric-card">
                    <div class="title" id="lbl-pwr">توان مصرفی</div>
                    <div class="val" style="color:var(--accent-green)" id="m-pwr">2.5 kW</div>
                </div>
            </div>
        </aside>

        <!-- ناحیه شبیه‌سازی و اسیلوسکوپ‌ها -->
        <main class="simulation-area">
            <div class="glass-panel canvas-container">
                <canvas id="circuitCanvas"></canvas>
            </div>

            <div class="scopes-grid">
                <div class="glass-panel scope-card scope-pwm">
                    <h3 id="lbl-scope-dc">ولتاژ لینک DC (ریپل خازن)</h3>
                    <div style="height: 110px; position: relative;">
                        <canvas id="scopeDC"></canvas>
                    </div>
                </div>
                <div class="glass-panel scope-card scope-out">
                    <h3 id="lbl-scope-out">جریان خروجی اینورتر (فاز U)</h3>
                    <div style="height: 110px; position: relative;">
                        <canvas id="scopeOUT"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // دیکشنری دو زبانه قانون طلایی
        const i18n = {
            fa: {
                title: "شبیه‌ساز درایور موتور AC (VFD)",
                subtitle: "کنترل سرعت موتور القایی با روش V/f از طریق رکتیفایر، لینک DC و اینورتر",
                flowLabel: "نوع جریان:",
                convFlow: "قراردادی (+ به -)",
                elecFlow: "الکترونی (- به +)",
                stateLabel: "وضعیت درایو (Run/Stop):",
                runBtn: "روشن (RUN)",
                stopBtn: "توقف (STOP)",
                freqLabel: "فرکانس هدف (Target Freq):",
                loadLabel: "بار مکانیکی (Torque Load):",
                statusRun: "حالت: درایو فعال (تولید PWM)",
                statusAccel: "حالت: شتاب‌گیری (Ramp Up/Down)",
                statusStop: "حالت: توقف (اینورتر خاموش)",
                outFreqLabel: "فرکانس خروجی",
                rpmLabel: "سرعت موتور (RPM)",
                outVLabel: "ولتاژ موتور (V_RMS)",
                pwrLabel: "توان مصرفی",
                scopeDc: "ولتاژ لینک DC (ریپل خازن)",
                scopeOut: "جریان خروجی اینورتر (فاز U)",
                gridName: "برق شبکه (AC)",
                rectName: "رکتیفایر (AC به DC)",
                capName: "لینک DC",
                invName: "اینورتر (DC به AC)",
                motorName: "موتور القایی 3 فاز"
            },
            en: {
                title: "AC Motor Drive Simulator (VFD)",
                subtitle: "Induction motor speed control using V/f via Rectifier, DC Link & Inverter",
                flowLabel: "Current Flow:",
                convFlow: "Conventional (+ to -)",
                elecFlow: "Electron (- to +)",
                stateLabel: "Drive State (Run/Stop):",
                runBtn: "Run",
                stopBtn: "Stop",
                freqLabel: "Target Frequency:",
                loadLabel: "Mechanical Load:",
                statusRun: "State: Drive Active (PWM Generation)",
                statusAccel: "State: Ramping (Accel/Decel)",
                statusStop: "State: Stopped (Inverter OFF)",
                outFreqLabel: "Output Frequency",
                rpmLabel: "Motor Speed (RPM)",
                outVLabel: "Motor Voltage (V_RMS)",
                pwrLabel: "Power Consumption",
                scopeDc: "DC Link Voltage (Capacitor Ripple)",
                scopeOut: "Inverter Output Current (Phase U)",
                gridName: "Grid Power (AC)",
                rectName: "Rectifier (AC/DC)",
                capName: "DC Link",
                invName: "Inverter (DC/AC)",
                motorName: "3-Phase Induction Motor"
            }
        };

        let currentLang = 'fa';
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('lang') === 'en') currentLang = 'en';

        function setLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
            
            const t = i18n[lang];
            document.getElementById('page-title').innerText = t.title;
            document.getElementById('txt-title').innerText = t.title;
            document.getElementById('txt-subtitle').innerText = t.subtitle;
            document.getElementById('lbl-flow').innerText = t.flowLabel;
            document.getElementById('btn-conv').innerText = t.convFlow;
            document.getElementById('btn-elec').innerText = t.elecFlow;
            document.getElementById('lbl-state').innerText = t.stateLabel;
            document.getElementById('btn-run').innerText = t.runBtn;
            document.getElementById('btn-stop').innerText = t.stopBtn;
            document.getElementById('lbl-freq').innerText = t.freqLabel;
            document.getElementById('lbl-load').innerText = t.loadLabel;
            document.getElementById('lbl-outfreq').innerText = t.outFreqLabel;
            document.getElementById('lbl-rpm').innerText = t.rpmLabel;
            document.getElementById('lbl-outv').innerText = t.outVLabel;
            document.getElementById('lbl-pwr').innerText = t.pwrLabel;
            document.getElementById('lbl-scope-dc').innerText = t.scopeDc;
            document.getElementById('lbl-scope-out').innerText = t.scopeOut;
        }

        // متغیرهای فیزیکی
        let flowMode = 'conv';
        let isRunning = true;
        let targetFreq = 50;
        let actualFreq = 0; // برای Ramp Up/Down
        let mechLoad = 5;
        const maxVoltage = 380;
        
        const canvas = document.getElementById('circuitCanvas');
        const ctx = canvas.getContext('2d');
        const canvasDC = document.getElementById('scopeDC');
        const ctxDC = canvasDC.getContext('2d');
        const canvasOUT = document.getElementById('scopeOUT');
        const ctxOUT = canvasOUT.getContext('2d');

        // کنترل‌های UI
        document.getElementById('slider-freq').addEventListener('input', (e) => { 
            targetFreq = parseFloat(e.target.value); 
            document.getElementById('val-freq').innerText = targetFreq + ' Hz'; 
        });
        document.getElementById('slider-load').addEventListener('input', (e) => { 
            mechLoad = parseFloat(e.target.value); 
            const labels = ['بسیار سبک', 'سبک', 'متوسط-سبک', 'متوسط', 'متوسط-سنگین', 'سنگین', 'خیلی سنگین', 'قفل نزدیک', 'استال'];
            document.getElementById('val-load').innerText = currentLang==='fa' ? labels[Math.min(8, Math.floor(mechLoad)-1)] : mechLoad; 
        });

        function setFlowMode(mode) {
            flowMode = mode;
            document.getElementById('btn-conv').classList.toggle('active', mode === 'conv');
            document.getElementById('btn-elec').classList.toggle('active', mode === 'elec');
        }

        function setRunState(state) {
            isRunning = state;
            document.getElementById('btn-run').classList.toggle('active', state);
            document.getElementById('btn-stop').classList.toggle('active', !state);
        }

        function resizeCanvases() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width; canvas.height = rect.height;
            const rectDC = canvasDC.parentElement.getBoundingClientRect();
            canvasDC.width = rectDC.width; canvasDC.height = rectDC.height;
            const rectOUT = canvasOUT.parentElement.getBoundingClientRect();
            canvasOUT.width = rectOUT.width; canvasOUT.height = rectOUT.height;
        }
        window.addEventListener('resize', resizeCanvases);
        setTimeout(resizeCanvases, 50);

        const dcHistory = [];
        const outHistory = [];
        const maxHistory = 300;

        const particles = [];
        for (let i = 0; i < 60; i++) {
            particles.push({ progress: Math.random(), phase: i % 3 }); // 3 phase particles
        }

        let time = 0;
        let motorAngle = 0;

        function animate() {
            time += 0.02;

            // Ramp Up / Ramp Down (Low pass filter on frequency)
            const destFreq = isRunning ? targetFreq : 0;
            actualFreq += (destFreq - actualFreq) * 0.02;

            // کنترل V/f (ولتاژ متناسب با فرکانس)
            const outVoltage = isRunning ? (actualFreq / 50) * maxVoltage : 0;
            
            // سرعت موتور (با محاسبه لغزش Slip)
            const syncRPM = actualFreq * 30; // موتور ۴ قطب
            const slip = (mechLoad * 2) * (actualFreq/50);
            let actualRPM = syncRPM > slip ? syncRPM - slip : 0;
            if(!isRunning) actualRPM = 0;

            motorAngle += (actualRPM / 60) * 0.1;

            // محاسبه توان و ولتاژ لینک DC
            const powerKW = isRunning ? ((outVoltage * actualFreq) / 5000) * (mechLoad * 0.5) : 0;
            const dcRipple = isRunning ? (Math.sin(time * 15) * (powerKW * 2)) : 0;
            const dcVoltage = 540 - (powerKW * 3) + dcRipple; // 380V AC -> ~540V DC

            // موج خروجی اینورتر برای اسیلوسکوپ
            // بجای PWM شلوغ، یک موج سینوسی با فرکانس متغیر ترسیم میکنیم تا قابل درک باشد
            const outWave = isRunning ? Math.sin(time * actualFreq * 0.1) * outVoltage : 0;

            // بروزرسانی UI
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-text');
            const t = i18n[currentLang];

            if (!isRunning && actualFreq < 1) {
                dot.className = 'status-dot off'; txt.innerText = t.statusStop;
            } else if (Math.abs(actualFreq - destFreq) > 1) {
                dot.className = 'status-dot on'; txt.innerText = t.statusAccel;
                dot.style.boxShadow = '0 0 15px var(--accent-gold)';
                dot.style.backgroundColor = 'var(--accent-gold)';
            } else {
                dot.className = 'status-dot on'; txt.innerText = t.statusRun;
                dot.style.boxShadow = '0 0 10px var(--accent-cyan)';
                dot.style.backgroundColor = 'var(--accent-cyan)';
            }

            document.getElementById('m-outfreq').innerText = actualFreq.toFixed(1) + ' Hz';
            document.getElementById('m-rpm').innerText = Math.round(actualRPM);
            document.getElementById('m-outv').innerText = Math.round(outVoltage) + ' V';
            document.getElementById('m-pwr').innerText = powerKW.toFixed(2) + ' kW';

            // هیستوری اسیلوسکوپ
            dcHistory.push(dcVoltage);
            outHistory.push(outWave);
            if (dcHistory.length > maxHistory) dcHistory.shift();
            if (outHistory.length > maxHistory) outHistory.shift();

            drawCircuit(actualFreq > 0.5, actualRPM);
            drawScopes();

            requestAnimationFrame(animate);
        }

        // --- ترسیم مدار مطابق قانون طلایی ---
        function drawCircuit(isActive, rpm) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width; const h = canvas.height;

            const gridX = w * 0.10;
            const rectX = w * 0.28;
            const capX = w * 0.48;
            const invX = w * 0.70;
            const motorX = w * 0.90;
            
            const topY = h * 0.35;
            const bottomY = h * 0.65;
            const midY = (topY + bottomY) / 2;

            // 1. سیم‌های ثابت (خاکستری تیره)
            ctx.lineWidth = 3; ctx.strokeStyle = '#334155'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            
            // Grid to Rectifier (2 Phase AC input)
            ctx.beginPath(); ctx.moveTo(gridX, topY); ctx.lineTo(rectX-25, topY); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(gridX, bottomY); ctx.lineTo(rectX-25, bottomY); ctx.stroke();

            // Rectifier to Inverter (DC Link)
            ctx.beginPath(); ctx.moveTo(rectX+25, topY); ctx.lineTo(invX-25, topY); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(rectX+25, bottomY); ctx.lineTo(invX-25, bottomY); ctx.stroke();

            // Capacitor vertical branch
            ctx.beginPath(); ctx.moveTo(capX, topY); ctx.lineTo(capX, bottomY); ctx.stroke();

            // Inverter to Motor (3 Phases U, V, W)
            ctx.beginPath(); ctx.moveTo(invX+25, topY); ctx.lineTo(motorX-30, topY); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(invX+25, midY); ctx.lineTo(motorX-30, midY); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(invX+25, bottomY); ctx.lineTo(motorX-30, bottomY); ctx.stroke();

            // 2. هایلایت مسیر جریان
            ctx.lineWidth = 4;
            if (isActive) {
                // AC Input
                ctx.strokeStyle = 'rgba(0, 242, 254, 0.4)';
                ctx.beginPath(); ctx.moveTo(gridX, topY); ctx.lineTo(rectX-25, topY); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(gridX, bottomY); ctx.lineTo(rectX-25, bottomY); ctx.stroke();

                // DC Link
                ctx.strokeStyle = 'rgba(255, 183, 3, 0.6)';
                ctx.beginPath(); ctx.moveTo(rectX+25, topY); ctx.lineTo(invX-25, topY); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(rectX+25, bottomY); ctx.lineTo(invX-25, bottomY); ctx.stroke();

                // 3 Phase output
                ctx.strokeStyle = 'rgba(46, 213, 115, 0.6)';
                ctx.beginPath(); ctx.moveTo(invX+25, topY); ctx.lineTo(motorX-30, topY); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(invX+25, midY); ctx.lineTo(motorX-30, midY); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(invX+25, bottomY); ctx.lineTo(motorX-30, bottomY); ctx.stroke();
            }

            // 3. ترسیم المان‌ها
            drawACGrid(gridX, midY);
            drawBlock(rectX, midY, 'AC', 'DC', i18n[currentLang].rectName, true);
            drawCapacitor(capX, midY);
            drawBlock(invX, midY, 'DC', 'PWM', i18n[currentLang].invName, isActive);
            draw3PhaseMotor(motorX, midY, rpm, isActive);

            // 4. انیمیشن ذرات
            drawParticles(isActive, gridX, rectX, capX, invX, motorX, topY, bottomY, midY);
        }

        function drawACGrid(x, y) {
            ctx.save(); ctx.fillStyle = '#0f172a'; ctx.strokeStyle = '#00f2fe'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(x, y, 26, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            
            ctx.strokeStyle = '#00f2fe';
            ctx.beginPath(); ctx.moveTo(x - 12, y); ctx.bezierCurveTo(x - 6, y - 15, x, y - 15, x, y); ctx.bezierCurveTo(x, y + 15, x + 6, y + 15, x + 12, y); ctx.stroke();
            
            ctx.fillStyle = '#94a3b8'; ctx.font = '11px Segoe UI'; ctx.textAlign = 'center';
            ctx.fillText(i18n[currentLang].gridName, x, y + 45); ctx.restore();
        }

        function drawBlock(x, y, inSym, outSym, label, isActive) {
            ctx.save(); ctx.translate(x, y);
            const activeColor = outSym === 'PWM' ? '#2ed573' : '#ffb703';
            const color = isActive ? activeColor : '#64748b';
            ctx.fillStyle = isActive ? (outSym === 'PWM' ? 'rgba(46,213,115,0.1)' : 'rgba(255,183,3,0.1)') : '#1e293b';
            ctx.strokeStyle = color; ctx.lineWidth = 2;
            
            ctx.beginPath(); ctx.rect(-25, -35, 50, 70); ctx.fill(); ctx.stroke();
            
            // Internal symbol
            ctx.beginPath(); ctx.moveTo(-25, 35); ctx.lineTo(25, -35); ctx.stroke();
            
            ctx.font = 'bold 12px Segoe UI'; ctx.fillStyle = color;
            ctx.fillText(inSym, -12, -10); ctx.fillText(outSym, 8, 15);
            
            ctx.font = '11px Segoe UI'; ctx.fillStyle = '#94a3b8'; ctx.textAlign = 'center';
            ctx.fillText(label, 0, 55);
            ctx.restore();
        }

        function drawCapacitor(x, y) {
            ctx.save(); ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(x - 15, y - 10); ctx.lineTo(x + 15, y - 10);
            ctx.moveTo(x - 15, y + 10); ctx.lineTo(x + 15, y + 10); ctx.stroke();
            ctx.font = '11px Segoe UI'; ctx.fillStyle = '#94a3b8'; ctx.textAlign = 'center';
            ctx.fillText(i18n[currentLang].capName, x, y + 55); ctx.restore();
        }

        function draw3PhaseMotor(x, y, rpm, isActive) {
            ctx.save(); ctx.translate(x, y);
            
            ctx.fillStyle = '#0f172a';
            ctx.strokeStyle = isActive ? '#2ed573' : '#64748b';
            if(isActive && rpm > 10) { ctx.shadowColor = '#2ed573'; ctx.shadowBlur = 15; }
            ctx.lineWidth = 3;
            
            // Motor outer circle
            ctx.beginPath(); ctx.arc(0, 0, 32, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.shadowBlur = 0;

            // Rotating fan
            ctx.rotate(motorAngle);
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 2;
            for(let i=0; i<3; i++) {
                ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0, -22); ctx.stroke();
                ctx.rotate((Math.PI * 2) / 3);
            }
            ctx.rotate(-motorAngle);

            ctx.font = 'bold 16px Segoe UI'; ctx.fillStyle = '#e2e8f0';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('M~', 0, 0);
            
            ctx.font = '11px Segoe UI'; ctx.fillStyle = '#94a3b8'; ctx.textBaseline = 'alphabetic';
            ctx.fillText(i18n[currentLang].motorName, 0, 55);
            ctx.restore();
        }

        function drawParticles(isActive, gridX, rectX, capX, invX, motorX, topY, bottomY, midY) {
            const speed = 0.01;
            particles.forEach(p => {
                if(!isActive) return;

                p.progress += speed;
                if (p.progress >= 1) p.progress = 0;

                let path = []; let pColor = '#00f2fe';

                // Section 1: AC Input (Grid to Rectifier)
                if(p.progress < 0.33) {
                    const localT = p.progress / 0.33;
                    pColor = '#00f2fe';
                    const yPath = p.phase % 2 === 0 ? topY : bottomY;
                    path = flowMode === 'conv' 
                        ? [{x:gridX, y:yPath}, {x:rectX-25, y:yPath}] 
                        : [{x:rectX-25, y:yPath}, {x:gridX, y:yPath}];
                    drawPoint(path, localT, pColor);
                } 
                // Section 2: DC Link (Rectifier to Inverter)
                else if (p.progress < 0.66) {
                    const localT = (p.progress - 0.33) / 0.33;
                    pColor = '#ffb703';
                    const yPath = p.phase % 2 === 0 ? topY : bottomY;
                    path = flowMode === 'conv'
                        ? [{x:rectX+25, y:yPath}, {x:invX-25, y:yPath}]
                        : [{x:invX-25, y:yPath}, {x:rectX+25, y:yPath}];
                    drawPoint(path, localT, pColor);
                }
                // Section 3: AC Output (Inverter to Motor)
                else {
                    const localT = (p.progress - 0.66) / 0.34;
                    pColor = '#2ed573';
                    let yPath = topY;
                    if(p.phase === 1) yPath = midY;
                    if(p.phase === 2) yPath = bottomY;
                    
                    // In AC 3-phase, current direction alternates, we simulate it visually oscillating
                    const wavePhase = Math.sin(time * actualFreq * 0.1 + (p.phase * 2 * Math.PI / 3));
                    let direction = wavePhase > 0 ? 1 : -1;
                    if(flowMode === 'elec') direction *= -1;

                    path = direction === 1 
                        ? [{x:invX+25, y:yPath}, {x:motorX-30, y:yPath}]
                        : [{x:motorX-30, y:yPath}, {x:invX+25, y:yPath}];
                    drawPoint(path, localT, pColor);
                }
            });
        }

        function drawPoint(path, t, color) {
            const pt = getPointAlongPath(path, t);
            if (pt) {
                ctx.beginPath(); ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 8;
                ctx.fill(); ctx.shadowBlur = 0;
            }
        }

        function getPointAlongPath(points, t) {
            if (points.length < 2) return null;
            const p1 = points[0]; const p2 = points[1];
            return { x: p1.x + (p2.x - p1.x)*t, y: p1.y + (p2.y - p1.y)*t };
        }

        function drawScopes() {
            // Scope 1: DC Link
            const wDC = canvasDC.width; const hDC = canvasDC.height;
            ctxDC.clearRect(0, 0, wDC, hDC);
            drawGridLine(ctxDC, wDC, hDC);
            
            ctxDC.strokeStyle = '#ffb703'; ctxDC.lineWidth = 2; ctxDC.beginPath();
            const stepDC = wDC / maxHistory;
            for (let i = 0; i < dcHistory.length; i++) {
                const x = i * stepDC;
                const y = hDC * 0.8 - (dcHistory[i] / 600) * (hDC * 0.6); // Scale 0-600V
                if (i===0) ctxDC.moveTo(x, y); else ctxDC.lineTo(x, y);
            }
            ctxDC.stroke();

            // Scope 2: Inverter AC Output
            const wOUT = canvasOUT.width; const hOUT = canvasOUT.height;
            ctxOUT.clearRect(0, 0, wOUT, hOUT);
            drawGridLine(ctxOUT, wOUT, hOUT, true); // True = draw center zero line
            
            ctxOUT.strokeStyle = isRunning ? '#2ed573' : '#64748b'; 
            ctxOUT.lineWidth = 2.5; ctxOUT.beginPath();
            const stepOUT = wOUT / maxHistory;
            for (let i = 0; i < outHistory.length; i++) {
                const x = i * stepOUT;
                const y = (hOUT/2) - (outHistory[i] / maxVoltage) * (hOUT/2 * 0.8);
                if (i===0) ctxOUT.moveTo(x, y); else ctxOUT.lineTo(x, y);
            }
            ctxOUT.stroke();
        }

        function drawGridLine(c, w, h, hasCenter=false) {
            c.strokeStyle = 'rgba(255,255,255,0.05)'; c.lineWidth = 1; c.beginPath();
            for (let x=0; x<w; x+=20) { c.moveTo(x,0); c.lineTo(x,h); }
            for (let y=0; y<h; y+=20) { c.moveTo(0,y); c.lineTo(w,y); }
            c.stroke();
            if(hasCenter) {
                c.strokeStyle = 'rgba(255, 255, 255, 0.2)'; c.setLineDash([4, 4]);
                c.beginPath(); c.moveTo(0, h/2); c.lineTo(w, h/2); c.stroke(); c.setLineDash([]);
            }
        }

        setLanguage(currentLang);
        requestAnimationFrame(animate);
    </script>
</body>
