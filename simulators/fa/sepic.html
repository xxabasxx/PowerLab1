<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><script>(function(){if(location.protocol==='file:')return;try{if(window.self!==window.top||window.frameElement)return;}catch(e){return;}var p=location.pathname.replace(/\/$/,''),f=p.split('/').pop().replace(/\.html$/i,''),l=location.pathname.indexOf('/en/')!==-1?'en':'fa';if(f&&f!=='simulators'&&f!=='fa'&&f!=='en'){window.location.replace('/?circuit='+encodeURIComponent(f)+'&lang='+l);}})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شبیه‌ساز مبدل سپیک (SEPIC Converter)</title>
    <style>
        :root {
            --bg-color: #0a0f1d;
            --panel-bg: rgba(18, 26, 47, 0.75);
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --accent-gold: #ffb703;
            --text-color: #e2e8f0;
            --border-color: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--accent-cyan);
            margin-bottom: 6px;
            text-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
        }

        header p {
            font-size: 0.95rem;
            color: #94a3b8;
        }

        .main-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1300px;
        }

        @media (max-width: 950px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .controls-sidebar {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group label {
            font-size: 0.82rem;
            display: flex;
            justify-content: space-between;
            color: #cbd5e1;
        }

        .control-group label span.val {
            color: var(--accent-cyan);
            font-weight: bold;
            direction: ltr;
        }

        input[type="range"] {
            appearance: none;
            width: 100%;
            height: 6px;
            background: #1e293b;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-cyan);
            cursor: pointer;
            box-shadow: 0 0 8px var(--accent-cyan);
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        .toggle-group {
            display: flex;
            background: #1e293b;
            border-radius: 8px;
            padding: 3px;
            gap: 4px;
        }

        .toggle-btn {
            flex: 1;
            padding: 7px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .toggle-btn.active {
            background: var(--accent-cyan);
            color: #0f172a;
            font-weight: bold;
        }

        .simulation-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 440px;
            background: rgba(10, 15, 29, 0.6);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .scopes-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 650px) {
            .scopes-grid {
                grid-template-columns: 1fr;
            }
        }

        .scope-card {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 10px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .scope-card h3 {
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .scope-card h3::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .scope-pwm h3::before { background: var(--accent-cyan); }
        .scope-out h3::before { background: var(--accent-gold); }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 5px;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .metric-card .title {
            font-size: 0.72rem;
            color: #64748b;
            margin-bottom: 4px;
        }

        .metric-card .val {
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent-cyan);
            direction: ltr;
        }
    </style>
</head>
<body>

    <header>
        <h1>شبیه‌ساز مبدل سپیک (SEPIC Converter)</h1>
        <p>مشاهده زنده عملکرد مبدل کاهنده-افزاینده غیرمعکوس‌کننده با پلاریته مثبت خروجی</p>
    </header>

    <div class="main-container">
        <!-- پنل تنظیمات -->
        <aside class="glass-panel controls-sidebar">
            <div class="control-group">
                <label>نوع نمایش جریان:</label>
                <div class="toggle-group">
                    <button class="toggle-btn active" id="btn-conv" onclick="setFlowMode('conv')">قراردادی (+ به -)</button>
                    <button class="toggle-btn" id="btn-elec" onclick="setFlowMode('elec')">الکترونی (- به +)</button>
                </div>
            </div>

            <div class="control-group">
                <label>ولتاژ ورودی (Vin): <span class="val" id="val-vin">12 V</span></label>
                <input type="range" id="slider-vin" min="5" max="30" value="12" step="1">
            </div>

            <div class="control-group">
                <label>چرخه کار (Duty Cycle): <span class="val" id="val-duty">50 %</span></label>
                <input type="range" id="slider-duty" min="10" max="85" value="50" step="1">
            </div>

            <div class="control-group">
                <label>سرعت سوئیچینگ (فرکانس): <span class="val" id="val-freq">5 Hz</span></label>
                <input type="range" id="slider-freq" min="1" max="15" value="5" step="1">
            </div>

            <div class="control-group">
                <label>خازن کوپلاژ (C1): <span class="val" id="val-cap1">100 µF</span></label>
                <input type="range" id="slider-cap1" min="10" max="500" value="100" step="10">
            </div>

            <div class="control-group">
                <label>خازن صافی خروجی (C2): <span class="val" id="val-cap2">470 µF</span></label>
                <input type="range" id="slider-cap2" min="10" max="1000" value="470" step="10">
            </div>

            <div class="control-group">
                <label>مقاومت بار (RL): <span class="val" id="val-res">10 Ω</span></label>
                <input type="range" id="slider-res" min="2" max="50" value="10" step="1">
            </div>

            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="title">ولتاژ ورودی</div>
                    <div class="val" id="m-vin">12.0 V</div>
                </div>
                <div class="metric-card">
                    <div class="title">ولتاژ خروجی</div>
                    <div class="val" id="m-vout">12.0 V</div>
                </div>
                <div class="metric-card">
                    <div class="title">ولتاژ ریپل</div>
                    <div class="val" id="m-vrip">0.15 V</div>
                </div>
                <div class="metric-card">
                    <div class="title">توان بار</div>
                    <div class="val" id="m-pwr">14.4 W</div>
                </div>
            </div>
        </aside>

        <!-- ناحیه شبیه‌سازی و اسیلوسکوپ‌ها -->
        <main class="simulation-area">
            <div class="glass-panel canvas-container">
                <canvas id="circuitCanvas"></canvas>
            </div>

            <div class="scopes-grid">
                <div class="glass-panel scope-card scope-pwm">
                    <h3>سیگنال سوئیچ (Gate PWM)</h3>
                    <div style="height: 110px; position: relative;">
                        <canvas id="scopePWM"></canvas>
                    </div>
                </div>
                <div class="glass-panel scope-card scope-out">
                    <h3>ولتاژ خروجی مثبت (Vout)</h3>
                    <div style="height: 110px; position: relative;">
                        <canvas id="scopeOut"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // متغیرهای فیزیک و UI
        let flowMode = 'conv';
        let Vin = 12;
        let dutyCycle = 0.5;
        let freq = 5;        // فرکانس نمایشی (Hz)
        let capC1_val = 100; // uF
        let capC2_val = 470; // uF
        let R_load = 10;     // Ohms

        // حالت‌های مدار
        let Vout_filtered = 12;
        let time = 0;
        let q = 0; // وضعیت سوئیچ (1 = روشن، 0 = خاموش)

        // المان‌های DOM
        const canvas = document.getElementById('circuitCanvas');
        const ctx = canvas.getContext('2d');
        const canvasPWM = document.getElementById('scopePWM');
        const ctxPWM = canvasPWM.getContext('2d');
        const canvasOut = document.getElementById('scopeOut');
        const ctxOut = canvasOut.getContext('2d');

        // اسلایدرها
        document.getElementById('slider-vin').addEventListener('input', e => { Vin = +e.target.value; document.getElementById('val-vin').innerText = Vin + ' V'; });
        document.getElementById('slider-duty').addEventListener('input', e => { dutyCycle = +e.target.value / 100; document.getElementById('val-duty').innerText = (dutyCycle*100).toFixed(0) + ' %'; });
        document.getElementById('slider-freq').addEventListener('input', e => { freq = +e.target.value; document.getElementById('val-freq').innerText = freq + ' Hz'; });
        document.getElementById('slider-cap1').addEventListener('input', e => { capC1_val = +e.target.value; document.getElementById('val-cap1').innerText = capC1_val + ' µF'; });
        document.getElementById('slider-cap2').addEventListener('input', e => { capC2_val = +e.target.value; document.getElementById('val-cap2').innerText = capC2_val + ' µF'; });
        document.getElementById('slider-res').addEventListener('input', e => { R_load = +e.target.value; document.getElementById('val-res').innerText = R_load + ' Ω'; });

        function setFlowMode(mode) {
            flowMode = mode;
            document.getElementById('btn-conv').classList.toggle('active', mode === 'conv');
            document.getElementById('btn-elec').classList.toggle('active', mode === 'elec');
        }

        // تنظیم سایز بوم‌ها
        function resizeCanvases() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            canvasPWM.width = canvasPWM.parentElement.clientWidth;
            canvasPWM.height = canvasPWM.parentElement.clientHeight;
            canvasOut.width = canvasOut.parentElement.clientWidth;
            canvasOut.height = canvasOut.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvases);
        setTimeout(resizeCanvases, 50);

        const pwmHistory = [];
        const outHistory = [];
        const maxHistory = 300;

        // ذرات متحرک
        const particles = [];
        for (let i = 0; i < 40; i++) particles.push({ progress: Math.random(), pathId: i % 2 });

        function animate() {
            time += 0.016;
            const period = 1 / freq;
            q = (time % period) < (dutyCycle * period) ? 1 : 0;

            // فرمول ولتاژ خروجی ایده آل مبدل سپیک: Vout = (D / (1 - D)) * Vin (غیرمعکوس / مثبت)
            const Vout_ideal = (dutyCycle / (1 - dutyCycle)) * Vin;
            
            // پاسخ دینامیکی خازن
            Vout_filtered += (Vout_ideal - Vout_filtered) * 0.08;

            // ریپل ولتاژ خروجی
            const I_out = Vout_filtered / R_load;
            const rippleAmp = (I_out * dutyCycle) / (freq * 100 * capC2_val * 1e-6);
            const Vout_instant = Vout_filtered + (q === 1 ? -rippleAmp : rippleAmp);

            // ثبت تاریخچه اسیلوسکوپ
            pwmHistory.push(q * 5);
            outHistory.push(Vout_instant);
            if (pwmHistory.length > maxHistory) pwmHistory.shift();
            if (outHistory.length > maxHistory) outHistory.shift();

            // بروزرسانی کارت‌های متریک
            const pwr = (Vout_filtered * Vout_filtered) / R_load;

            document.getElementById('m-vin').innerText = Vin.toFixed(1) + ' V';
            document.getElementById('m-vout').innerText = Vout_filtered.toFixed(1) + ' V';
            document.getElementById('m-vrip').innerText = (rippleAmp * 2).toFixed(2) + ' V';
            document.getElementById('m-pwr').innerText = pwr.toFixed(1) + ' W';

            drawCircuit();
            drawScope(ctxPWM, canvasPWM, pwmHistory, 6, '#00f2fe');
            drawScope(ctxOut, canvasOut, outHistory, Math.max(40, Vout_ideal * 1.3), '#ffb703');

            requestAnimationFrame(animate);
        }

        function drawCircuit() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width, h = canvas.height;

            // مختصات گره‌های مدار SEPIC
            const yTop = h * 0.35, yBot = h * 0.75;
            const xVin = w * 0.1;
            const xNodeA = w * 0.30; // سوئیچ و L1
            const xNodeB = w * 0.52; // L2 و C1
            const xNodeC = w * 0.74; // C2 و دیود
            const xLoad = w * 0.9;   // بار

            // سیم‌کشی پایه (به صورت کاملا پیوسته تا قطعی به وجود نیاید)
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#334155';
            ctx.lineJoin = 'round';
            
            // ریل پایین (GND)
            ctx.beginPath();
            ctx.moveTo(xVin, yBot); ctx.lineTo(xLoad, yBot);
            ctx.stroke();

            // اتصالات افقی بالا (پیوسته)
            ctx.beginPath();
            ctx.moveTo(xVin, yTop); ctx.lineTo(xLoad, yTop);
            ctx.stroke();

            // اتصالات عمودی (پیوسته)
            ctx.beginPath();
            ctx.moveTo(xVin, yTop); ctx.lineTo(xVin, yBot); // لاین منبع
            ctx.moveTo(xNodeA, yTop); ctx.lineTo(xNodeA, yBot); // سوئیچ Q
            ctx.moveTo(xNodeB, yTop); ctx.lineTo(xNodeB, yBot); // سلف L2
            ctx.moveTo(xNodeC, yTop); ctx.lineTo(xNodeC, yBot); // خازن C2
            ctx.moveTo(xLoad, yTop); ctx.lineTo(xLoad, yBot); // بار
            ctx.stroke();

            /* ===== هایلایت مسیر فعال (سبک Buck) ===== */
            ctx.lineWidth = 4;
            if (q === 1) {
                // سوئیچ روشن - فیروزه‌ای
                ctx.strokeStyle = 'rgba(0, 242, 254, 0.6)';
                ctx.shadowColor = '#00f2fe'; ctx.shadowBlur = 8;
                
                // حلقه 1: Vin -> L1 -> Q -> GND
                ctx.beginPath();
                ctx.moveTo(xVin, yBot); ctx.lineTo(xVin, yTop); ctx.lineTo(xNodeA, yTop);
                ctx.lineTo(xNodeA, yBot); ctx.lineTo(xVin, yBot);
                ctx.stroke();
                
                // حلقه 2: C1 -> Q -> GND -> L2
                ctx.beginPath();
                ctx.moveTo(xNodeA, yTop); ctx.lineTo(xNodeB, yTop); ctx.lineTo(xNodeB, yBot);
                ctx.lineTo(xNodeA, yBot); ctx.lineTo(xNodeA, yTop);
                ctx.stroke();
            } else {
                // سوئیچ خاموش - طلایی (هرزگرد)
                ctx.strokeStyle = 'rgba(255, 183, 3, 0.6)';
                ctx.shadowColor = '#ffb703'; ctx.shadowBlur = 8;
                
                // L1 و C1 انرژی را از طریق دیود به خروجی تخلیه می‌کنند
                ctx.beginPath();
                ctx.moveTo(xVin, yBot); ctx.lineTo(xVin, yTop); ctx.lineTo(xNodeB, yTop);
                ctx.lineTo(xNodeC, yTop); ctx.lineTo(xLoad, yTop); ctx.lineTo(xLoad, yBot);
                ctx.lineTo(xVin, yBot);
                ctx.stroke();

                // L2 انرژی خود را از طریق دیود به خروجی می‌دهد
                ctx.beginPath();
                ctx.moveTo(xNodeB, yBot); ctx.lineTo(xNodeB, yTop); ctx.lineTo(xNodeC, yTop);
                ctx.lineTo(xNodeC, yBot); ctx.lineTo(xNodeB, yBot);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;
            /* ======================================= */

            // رسم المان‌ها (ارسال دقیق گره‌ها برای از بین بردن فاصله‌ها)
            drawDCSource(xVin, yTop, yBot, Vin);
            drawInductor(xVin, yTop, xNodeA, yTop, 'L1'); // تغییر به xVin
            drawSwitch(xNodeA, yTop, yBot, q === 1);
            drawCapacitor(xNodeA, yTop, xNodeB, yTop, capC1_val, false, 'C1');
            drawInductorVert(xNodeB, yTop, yBot, 'L2');
            drawDiodeHoriz(xNodeB, yTop, xNodeC, yTop, q === 0); // اتصال دقیق به گره B و C
            drawCapacitorVert(xNodeC, yTop, yBot, capC2_val, 'C2'); // اتصال دقیق به Top و Bot
            drawResistor(xLoad, yTop, yBot, R_load);

            // گره‌ها
            drawNode(xNodeA, yTop); drawNode(xNodeA, yBot);
            drawNode(xNodeB, yTop); drawNode(xNodeB, yBot);
            drawNode(xNodeC, yTop); drawNode(xNodeC, yBot);

            drawParticles(xVin, xNodeA, xNodeB, xNodeC, xLoad, yTop, yBot);
        }

        // توابع رسم المان‌ها (اضافه شدن ماسک پس زمینه برای جلوگیری از تداخل سیم‌ها)
        function drawDCSource(x, y1, y2, vol) {
            const cy = (y1 + y2) / 2;
            ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(x, cy, 22, 0, Math.PI*2); ctx.fill(); // ماسک
            ctx.strokeStyle = '#4facfe'; ctx.lineWidth = 2; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x - 12, cy - 8); ctx.lineTo(x + 12, cy - 8); // +
            ctx.moveTo(x - 6, cy + 8); ctx.lineTo(x + 6, cy + 8); // -
            ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = '#cbd5e1'; ctx.font = '12px Segoe UI'; ctx.textAlign = 'center';
            ctx.fillText(vol + 'V', x - 35, cy + 4);
        }

        function drawInductor(x1, y1, x2, y2, label) {
            const r = 10;
            const cx = (x1 + x2) / 2;
            
            // ماسک پس زمینه برای پاک کردن خط صاف از وسط سلف
            ctx.fillStyle = '#0a0f1d';
            ctx.fillRect(cx - 26, y1 - 6, 52, 12);

            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(cx - 15, y1, r, Math.PI, 0);
            ctx.arc(cx - 5, y1, r, Math.PI, 0);
            ctx.arc(cx + 5, y1, r, Math.PI, 0);
            ctx.arc(cx + 15, y1, r, Math.PI, 0);
            ctx.stroke();
            ctx.fillStyle = '#cbd5e1'; ctx.fillText(label, cx, y1 - 20);
        }

        function drawInductorVert(x, y1, y2, label) {
            const cy = (y1 + y2) / 2;
            const r = 8;
            
            ctx.fillStyle = '#0a0f1d';
            ctx.fillRect(x - 6, cy - 26, 12, 52); // ماسک

            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(x, cy - 15, r, -Math.PI/2, Math.PI/2);
            ctx.arc(x, cy - 5, r, -Math.PI/2, Math.PI/2);
            ctx.arc(x, cy + 5, r, -Math.PI/2, Math.PI/2);
            ctx.arc(x, cy + 15, r, -Math.PI/2, Math.PI/2);
            ctx.stroke();
            ctx.fillStyle = '#cbd5e1'; ctx.fillText(label, x - 25, cy + 4);
        }

        function drawSwitch(x, y1, y2, isClosed) {
            ctx.fillStyle = '#0a0f1d';
            ctx.fillRect(x - 15, y1 + 25, 30, (y2 - 25) - (y1 + 25)); // ماسک وسط سوئیچ

            ctx.strokeStyle = '#334155'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y1 + 30); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x, y2); ctx.lineTo(x, y2 - 30); ctx.stroke();
            
            ctx.strokeStyle = isClosed ? '#00f2fe' : '#94a3b8';
            if (isClosed) { ctx.shadowColor = '#00f2fe'; ctx.shadowBlur = 8; }
            ctx.lineWidth = 4; ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x, y1 + 30);
            ctx.lineTo(isClosed ? x : x - 25, y2 - 30);
            ctx.stroke();
            ctx.shadowBlur = 0; ctx.lineCap = 'butt';
            
            ctx.fillStyle = '#e2e8f0'; ctx.beginPath(); ctx.arc(x, y1 + 30, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x, y2 - 30, 4, 0, Math.PI*2); ctx.fill();
            ctx.fillText('Q', x + 15, (y1 + y2)/2);
        }

        function drawCapacitor(x1, y1, x2, y2, val, isVert, label) {
            const gap = 6;
            const cx = (x1 + x2) / 2;
            
            ctx.fillStyle = '#0a0f1d';
            ctx.fillRect(cx - gap + 1, y1 - 20, (2*gap) - 2, 40); // ماسک وسط خازن

            ctx.strokeStyle = '#64748b'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(cx - gap, y1); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx + gap, y1); ctx.lineTo(x2, y1); ctx.stroke();
            ctx.strokeStyle = '#00f2fe'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(cx - gap, y1 - 15); ctx.lineTo(cx - gap, y1 + 15); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx + gap, y1 - 15); ctx.lineTo(cx + gap, y1 + 15); ctx.stroke();
            ctx.fillStyle = '#cbd5e1'; ctx.fillText(label + ' (' + val + 'µF)', cx, y1 - 25);
        }

        function drawCapacitorVert(x, y1, y2, val, label) {
            const gap = 6;
            const cy = (y1 + y2) / 2;
            
            ctx.fillStyle = '#0a0f1d';
            ctx.fillRect(x - 20, cy - gap + 1, 40, (2*gap) - 2); // ماسک وسط خازن

            ctx.strokeStyle = '#64748b'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, cy - gap); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x, cy + gap); ctx.lineTo(x, y2); ctx.stroke();
            ctx.strokeStyle = '#00f2fe'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(x - 15, cy - gap); ctx.lineTo(x + 15, cy - gap); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x - 15, cy + gap); ctx.lineTo(x + 15, cy + gap); ctx.stroke();
            ctx.fillStyle = '#cbd5e1'; ctx.fillText(label + ' (' + val + 'µF)', x + 30, cy + 4);
        }

        function drawDiodeHoriz(x1, y1, x2, y2, isActive) {
            const cx = (x1 + x2) / 2;
            
            ctx.fillStyle = '#0a0f1d';
            ctx.fillRect(cx - 15, y1 - 15, 30, 30); // ماسک زیر دیود

            ctx.strokeStyle = '#334155'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(cx - 12, y1); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx + 12, y1); ctx.lineTo(x2, y1); ctx.stroke();
            
            ctx.fillStyle = isActive ? '#ffb703' : '#1e293b';
            ctx.strokeStyle = isActive ? '#ffb703' : '#64748b';
            if (isActive) { ctx.shadowColor = '#ffb703'; ctx.shadowBlur = 10; }
            
            // دیود به سمت راست
            ctx.beginPath(); ctx.moveTo(cx - 10, y1 - 12); ctx.lineTo(cx - 10, y1 + 12);
            ctx.lineTo(cx + 10, y1); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx + 10, y1 - 12); ctx.lineTo(cx + 10, y1 + 12); ctx.stroke();
            
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#cbd5e1'; ctx.fillText('D', cx, y1 - 20);
        }

        function drawResistor(x, y1, y2, val) {
            ctx.fillStyle = '#0a0f1d';
            ctx.fillRect(x - 15, y1 + 25, 30, (y2 - 25) - (y1 + 25)); // ماسک زیر مقاومت

            ctx.strokeStyle = '#475569'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y1 + 30);
            let currY = y1 + 30;
            for (let i = 0; i < 5; i++) {
                ctx.lineTo(x - 10, currY + 7); ctx.lineTo(x + 10, currY + 21); currY += 28;
            }
            ctx.lineTo(x, currY); ctx.lineTo(x, y2); ctx.stroke();
            ctx.fillStyle = '#cbd5e1'; ctx.fillText('بار (' + val + 'Ω)', x + 30, (y1+y2)/2);
        }

        function drawNode(x, y) {
            ctx.fillStyle = '#94a3b8'; ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2); ctx.fill();
        }

        function drawParticles(xVin, xNodeA, xNodeB, xNodeC, xLoad, yTop, yBot) {
            const speed = 0.003 * freq + 0.005;
            const pColor = q === 1 ? '#00f2fe' : '#ffb703';

            particles.forEach(p => {
                p.progress += speed;
                if (p.progress >= 1) p.progress = 0;

                let path = [];
                if (q === 1) {
                    if (p.pathId === 0) { // Vin -> L1 -> Q
                        path = [ {x:xVin, y:yBot}, {x:xVin, y:yTop}, {x:xNodeA, y:yTop}, {x:xNodeA, y:yBot}, {x:xVin, y:yBot} ];
                    } else { // C1 -> Q -> L2
                        path = [ {x:xNodeA, y:yTop}, {x:xNodeB, y:yTop}, {x:xNodeB, y:yBot}, {x:xNodeA, y:yBot}, {x:xNodeA, y:yTop} ];
                    }
                } else {
                    if (p.pathId === 0) { // Vin -> L1 -> C1 -> D -> Load
                        path = [ {x:xVin, y:yBot}, {x:xVin, y:yTop}, {x:xNodeB, y:yTop}, {x:xNodeC, y:yTop}, {x:xLoad, y:yTop}, {x:xLoad, y:yBot}, {x:xVin, y:yBot} ];
                    } else { // L2 -> D -> Load
                        path = [ {x:xNodeB, y:yBot}, {x:xNodeB, y:yTop}, {x:xNodeC, y:yTop}, {x:xLoad, y:yTop}, {x:xLoad, y:yBot}, {x:xNodeB, y:yBot} ];
                    }
                }

                if (flowMode === 'elec') path.reverse();

                const pt = getPointAlongPath(path, p.progress);
                if (pt) {
                    ctx.beginPath(); ctx.arc(pt.x, pt.y, 4, 0, Math.PI*2);
                    ctx.fillStyle = pColor; ctx.shadowColor = pColor; ctx.shadowBlur = 8;
                    ctx.fill(); ctx.shadowBlur = 0;
                }
            });
        }

        function getPointAlongPath(points, t) {
            let totalLen = 0, lengths = [];
            for (let i = 0; i < points.length - 1; i++) {
                const len = Math.hypot(points[i+1].x - points[i].x, points[i+1].y - points[i].y);
                lengths.push(len); totalLen += len;
            }
            let targetLen = t * totalLen, currentLen = 0;
            for (let i = 0; i < lengths.length; i++) {
                if (currentLen + lengths[i] >= targetLen) {
                    const segT = (targetLen - currentLen) / lengths[i];
                    return {
                        x: points[i].x + (points[i+1].x - points[i].x) * segT,
                        y: points[i].y + (points[i+1].y - points[i].y) * segT
                    };
                }
                currentLen += lengths[i];
            }
            return points[points.length - 1];
        }

        function drawScope(c, canvas, data, scaleVal, color) {
            const w = canvas.width, h = canvas.height;
            c.clearRect(0, 0, w, h);

            c.strokeStyle = 'rgba(255, 255, 255, 0.05)'; c.lineWidth = 1;
            c.beginPath();
            for (let x = 0; x < w; x += 20) { c.moveTo(x, 0); c.lineTo(x, h); }
            for (let y = 0; y < h; y += 20) { c.moveTo(0, y); c.lineTo(w, y); }
            c.stroke();

            const midY = h * 0.75; // خط صفر پایین صفحه (چون ولتاژ مثبت است)
            c.strokeStyle = 'rgba(255, 255, 255, 0.15)'; c.beginPath(); c.moveTo(0, midY); c.lineTo(w, midY); c.stroke();

            if (data.length < 2) return;
            c.beginPath(); c.strokeStyle = color; c.lineWidth = 2.5;
            const step = w / maxHistory;

            for (let i = 0; i < data.length; i++) {
                const val = isNaN(data[i]) ? 0 : data[i];
                const y = midY - (val / scaleVal) * (h * 0.6);
                if (i === 0) c.moveTo(i * step, y); else c.lineTo(i * step, y);
            }
            c.stroke();
        }

        requestAnimationFrame(animate);
    </script>
