<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><script>(function(){if(location.protocol==='file:')return;try{if(window.self!==window.top||window.frameElement)return;}catch(e){return;}var p=location.pathname.replace(/\/$/,''),f=p.split('/').pop().replace(/\.html$/i,''),l=location.pathname.indexOf('/en/')!==-1?'en':'fa';if(f&&f!=='simulators'&&f!=='fa'&&f!=='en'){window.location.replace('/?circuit='+encodeURIComponent(f)+'&lang='+l);}})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">شبیه‌ساز مدار کلمپر (Clamper Circuit)</title>
    <style>
        :root {
            --bg-color: #0a0f1d;
            --panel-bg: rgba(18, 26, 47, 0.75);
            --accent-cyan: #00d2d3;
            --accent-blue: #54a0ff;
            --accent-gold: #ffb020;
            --accent-green: #10ac84;
            --accent-red: #ee5253;
            --accent-purple: #9b59b6;
            --text-color: #e2e8f0;
            --border-color: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--accent-cyan);
            margin-bottom: 6px;
            text-shadow: 0 0 8px rgba(0, 210, 211, 0.3);
        }

        header p {
            font-size: 0.95rem;
            color: #94a3b8;
        }

        .main-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1350px;
        }

        @media (max-width: 950px) {
            .main-container { grid-template-columns: 1fr; }
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .controls-sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group label {
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            color: #cbd5e1;
        }

        .control-group label span.val {
            color: var(--accent-cyan);
            font-weight: bold;
            direction: ltr;
        }

        input[type="range"] {
            appearance: none;
            width: 100%;
            height: 6px;
            background: #1e293b;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent-cyan);
            cursor: pointer;
            box-shadow: 0 0 6px var(--accent-cyan);
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }

        .toggle-group {
            display: flex;
            background: #1e293b;
            border-radius: 8px;
            padding: 3px;
            gap: 4px;
        }

        .toggle-btn {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 0.82rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .toggle-btn.active {
            background: var(--accent-cyan);
            color: #0f172a;
            font-weight: bold;
        }

        .simulation-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 420px;
            background: rgba(10, 15, 29, 0.6);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        canvas { width: 100%; height: 100%; display: block; }

        .scopes-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .scope-card {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 10px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .scope-card h3 {
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .scope-wave h3::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-cyan); }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 5px;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
        }

        .metric-card .title {
            font-size: 0.75rem;
            color: #64748b;
            margin-bottom: 4px;
        }

        .metric-card .val {
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--accent-cyan);
            direction: ltr;
        }

        .state-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px;
            background: rgba(255,255,255,0.04);
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .status-dot.active { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
        .status-dot.inactive { background: var(--accent-gold); box-shadow: 0 0 8px var(--accent-gold); }

    </style>
</head>
<body>

    <header>
        <h1 id="txt-title">شبیه‌ساز مدار کلمپر (Clamper Circuit)</h1>
        <p id="txt-subtitle">انتقال سطح DC سیگنال AC بدون تغییر در دامنه و شکل موج</p>
    </header>

    <div class="main-container">
        <!-- پنل تنظیمات -->
        <aside class="glass-panel controls-sidebar">
            <div class="control-group" style="display: none;">
                <label id="lbl-lang">زبان / Language:</label>
                <div class="toggle-group">
                    <button class="toggle-btn active" id="btn-lang-fa" onclick="setLanguage('fa')">فارسی (FA)</button>
                    <button class="toggle-btn" id="btn-lang-en" onclick="setLanguage('en')">English (EN)</button>
                </div>
            </div>

            <div class="control-group">
                <label id="lbl-type">نوع کلمپر:</label>
                <div class="toggle-group">
                    <button class="toggle-btn active" id="btn-type-pos" onclick="setClamperType('positive')">مثبت (Positive)</button>
                    <button class="toggle-btn" id="btn-type-neg" onclick="setClamperType('negative')">منفی (Negative)</button>
                </div>
            </div>

            <div class="control-group">
                <label><span id="lbl-vp">دامنه پیک ورودی (V_p):</span> <span class="val" id="val-vp">10.0 V</span></label>
                <input type="range" id="slider-vp" min="2" max="20" value="10" step="0.5">
            </div>

            <div class="control-group">
                <label><span id="lbl-vbias">ولتاژ بایاس DC (V_bias):</span> <span class="val" id="val-vbias">3.0 V</span></label>
                <input type="range" id="slider-vbias" min="-10" max="10" value="3" step="0.5">
            </div>

            <div class="control-group">
                <label><span id="lbl-cap">ظرفیت خازن (C):</span> <span class="val" id="val-cap">10 µF</span></label>
                <input type="range" id="slider-cap" min="1" max="100" value="10" step="1">
            </div>

            <div class="control-group">
                <label><span id="lbl-rl">مقاومت بار (R_L):</span> <span class="val" id="val-rl">10 kΩ</span></label>
                <input type="range" id="slider-rl" min="1" max="100" value="10" step="1">
            </div>

            <div class="state-indicator">
                <div class="status-dot active" id="status-dot"></div>
                <span id="status-text" style="color: var(--accent-green);">دیود: روشن (هدایت/شارژ)</span>
            </div>

            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="title" id="lbl-vc">ولتاژ خازن (V_C)</div>
                    <div class="val" style="color:var(--accent-purple)" id="m-vc">13.0 V</div>
                </div>
                <div class="metric-card">
                    <div class="title" id="lbl-vmax">حداکثر پیک (V_max)</div>
                    <div class="val" id="m-vmax">23.0 V</div>
                </div>
                <div class="metric-card">
                    <div class="title" id="lbl-vmin">حداقل پیک (V_min)</div>
                    <div class="val" id="m-vmin">3.0 V</div>
                </div>
                <div class="metric-card">
                    <div class="title" id="lbl-shift">انتقال سطح DC</div>
                    <div class="val" style="color:var(--accent-gold)" id="m-shift">+13.0 V</div>
                </div>
            </div>
        </aside>

        <!-- ناحیه شبیه‌سازی -->
        <main class="simulation-area">
            <div class="glass-panel canvas-container">
                <canvas id="circuitCanvas"></canvas>
            </div>

            <div class="scopes-grid">
                <div class="glass-panel scope-card scope-wave">
                    <h3 id="lbl-scope-wave">اسیلوسکوپ: ولتاژ ورودی AC (زرد) و ولتاژ خروجی منتقل‌شده (فیروزه‌ای)</h3>
                    <div style="height: 180px; position: relative;">
                        <canvas id="scopeWave"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const i18n = {
            fa: {
                title: "شبیه‌ساز مدار کلمپر (Clamper Circuit)",
                subtitle: "انتقال سطح DC سیگنال AC بدون تغییر در دامنه و شکل موج",
                langLabel: "زبان / Language:",
                typeLabel: "نوع کلمپر:",
                vpLabel: "دامنه پیک ورودی (V_p):",
                vbiasLabel: "ولتاژ بایاس DC (V_bias):",
                capLabel: "ظرفیت خازن (C):",
                rlLabel: "مقاومت بار (R_L):",
                diodeOn: "دیود: روشن (هدایت / شارژ خازن)",
                diodeOff: "دیود: خاموش (قطع / تخلیه کند)",
                vcLabel: "ولتاژ خازن (V_C)",
                vmaxLabel: "حداکثر پیک (V_max)",
                vminLabel: "حداقل پیک (V_min)",
                shiftLabel: "انتقال سطح DC",
                scopeWave: "اسیلوسکوپ: ولتاژ ورودی AC (زرد) و ولتاژ خروجی منتقل‌شده (فیروزه‌ای)",
                srcName: "منبع AC (V_in)",
                capName: "خازن C",
                diodeName: "دیود D",
                vbiasName: "منبع بایاس V_b",
                loadName: "مقاومت بار R_L"
            },
            en: {
                title: "Clamper Circuit Simulator",
                subtitle: "DC level shifting of AC signals without altering amplitude or shape",
                langLabel: "Language / زبان:",
                typeLabel: "Clamper Type:",
                vpLabel: "Input Peak Voltage (V_p):",
                vbiasLabel: "DC Bias Voltage (V_bias):",
                capLabel: "Capacitance (C):",
                rlLabel: "Load Resistance (R_L):",
                diodeOn: "Diode: ON (Conducting / Charging C)",
                diodeOff: "Diode: OFF (Cutoff / Slow Discharge)",
                vcLabel: "Capacitor Voltage (V_C)",
                vmaxLabel: "Peak Max Voltage (V_max)",
                vminLabel: "Peak Min Voltage (V_min)",
                shiftLabel: "DC Level Shift",
                scopeWave: "Oscilloscope: AC Input Voltage (Yellow) & Clamped Output Voltage (Cyan)",
                srcName: "AC Supply (V_in)",
                capName: "Capacitor C",
                diodeName: "Diode D",
                vbiasName: "Bias Source V_b",
                loadName: "Load Resistor R_L"
            }
        };

        let currentLang = 'fa';
        function setLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
            document.getElementById('btn-lang-fa').classList.toggle('active', lang === 'fa');
            document.getElementById('btn-lang-en').classList.toggle('active', lang === 'en');
            
            const t = i18n[lang];
            document.getElementById('page-title').innerText = t.title;
            document.getElementById('txt-title').innerText = t.title;
            document.getElementById('txt-subtitle').innerText = t.subtitle;
            document.getElementById('lbl-lang').innerText = t.langLabel;
            document.getElementById('lbl-type').innerText = t.typeLabel;
            document.getElementById('lbl-vp').innerText = t.vpLabel;
            document.getElementById('lbl-vbias').innerText = t.vbiasLabel;
            document.getElementById('lbl-cap').innerText = t.capLabel;
            document.getElementById('lbl-rl').innerText = t.rlLabel;
            document.getElementById('lbl-vc').innerText = t.vcLabel;
            document.getElementById('lbl-vmax').innerText = t.vmaxLabel;
            document.getElementById('lbl-vmin').innerText = t.vminLabel;
            document.getElementById('lbl-shift').innerText = t.shiftLabel;
            document.getElementById('lbl-scope-wave').innerText = t.scopeWave;
        }

        // Parameters
        let clamperType = 'positive'; // 'positive' or 'negative'
        let V_p = 10.0;
        let V_bias = 3.0;
        let Capacitance = 10; // uF
        let R_L = 10; // kOhms

        const canvas = document.getElementById('circuitCanvas');
        const ctx = canvas.getContext('2d');
        const canvasWave = document.getElementById('scopeWave');
        const ctxWave = canvasWave.getContext('2d');

        function setClamperType(type) {
            clamperType = type;
            document.getElementById('btn-type-pos').classList.toggle('active', type === 'positive');
            document.getElementById('btn-type-neg').classList.toggle('active', type === 'negative');
            v_C = 0; // reset capacitor charge on type change
        }

        document.getElementById('slider-vp').addEventListener('input', e => { V_p = parseFloat(e.target.value); document.getElementById('val-vp').innerText = V_p.toFixed(1) + ' V'; });
        document.getElementById('slider-vbias').addEventListener('input', e => { V_bias = parseFloat(e.target.value); document.getElementById('val-vbias').innerText = V_bias.toFixed(1) + ' V'; });
        document.getElementById('slider-cap').addEventListener('input', e => { Capacitance = parseFloat(e.target.value); document.getElementById('val-cap').innerText = Capacitance + ' µF'; });
        document.getElementById('slider-rl').addEventListener('input', e => { R_L = parseFloat(e.target.value); document.getElementById('val-rl').innerText = R_L + ' kΩ'; });

        function resizeCanvases() {
            const rect = canvas.parentElement.getBoundingClientRect(); canvas.width = rect.width; canvas.height = rect.height;
            const rw = canvasWave.parentElement.getBoundingClientRect(); canvasWave.width = rw.width; canvasWave.height = rw.height;
        }
        window.addEventListener('resize', resizeCanvases);
        setTimeout(resizeCanvases, 50);

        const hist_Vin = [];
        const hist_Vout = [];
        const maxHistory = 400;

        let particles = [];
        let time = 0;
        let v_C = 0; // State variable for capacitor voltage

        // Closed rectangle coordinates
        let leftX, rightX, topY, botY;
        let midX_cap, midX_diode;

        function animate() {
            time += 0.05; 
            
            const w_ac = 1.0;
            const v_in_inst = V_p * Math.sin(time * w_ac);

            let isDiodeON = false;
            let v_out = 0;

            // Clamper Physics Calculation with RC discharge
            const tau = (R_L * 1e3) * (Capacitance * 1e-6); // Time constant in seconds
            const dt = 0.002;

            if (clamperType === 'positive') {
                // Positive Clamper: Diode anode to ground/bias, cathode to top line
                // Diode turns ON when (v_in_inst + v_C) < V_bias
                if ((v_in_inst + v_C) < V_bias) {
                    isDiodeON = true;
                    // Rapid charge
                    v_C += (V_bias - v_in_inst - v_C) * 0.3;
                } else {
                    isDiodeON = false;
                    // Slow discharge through RL
                    v_C -= (v_C / tau) * dt * 10;
                }
                v_out = v_in_inst + v_C;
            } else {
                // Negative Clamper: Diode cathode to ground/bias, anode to top line
                // Diode turns ON when (v_in_inst - v_C) > V_bias
                if ((v_in_inst - v_C) > V_bias) {
                    isDiodeON = true;
                    // Rapid charge towards (v_in - V_bias)
                    v_C += (v_in_inst - V_bias - v_C) * 0.3;
                } else {
                    isDiodeON = false;
                    // Slow discharge
                    v_C -= (v_C / tau) * dt * 10;
                }
                v_out = v_in_inst - v_C;
            }

            const t = i18n[currentLang];
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-text');

            if (isDiodeON) {
                dot.className = 'status-dot active';
                txt.innerText = t.diodeOn;
                txt.style.color = 'var(--accent-green)';
            } else {
                dot.className = 'status-dot inactive';
                txt.innerText = t.diodeOff;
                txt.style.color = 'var(--accent-gold)';
            }

            // Metrics
            const v_max = clamperType === 'positive' ? (2 * V_p + V_bias) : V_bias;
            const v_min = clamperType === 'positive' ? V_bias : (-2 * V_p + V_bias);
            const dc_shift = clamperType === 'positive' ? v_C : -v_C;

            document.getElementById('m-vc').innerText = Math.abs(v_C).toFixed(1) + ' V';
            document.getElementById('m-vmax').innerText = v_max.toFixed(1) + ' V';
            document.getElementById('m-vmin').innerText = v_min.toFixed(1) + ' V';
            document.getElementById('m-shift').innerText = (dc_shift >= 0 ? '+' : '') + dc_shift.toFixed(1) + ' V';

            hist_Vin.push(v_in_inst);
            hist_Vout.push(v_out);
            if (hist_Vin.length > maxHistory) { hist_Vin.shift(); hist_Vout.shift(); }

            drawCircuit(v_in_inst, v_out, isDiodeON);
            drawWaveScope();

            if (Math.random() > 0.35) spawnParticle('top');
            updateParticles(isDiodeON);

            requestAnimationFrame(animate);
        }

        function drawCircuit(vIn, vOut, isDiodeON) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width;
            const h = canvas.height;
            const t = i18n[currentLang];

            // ===== CLOSED RECTANGLE GEOMETRY =====
            leftX      = w * 0.14;
            rightX     = w * 0.86;
            topY       = h * 0.28;
            botY       = h * 0.72;
            midX_cap   = w * 0.38;
            midX_diode = w * 0.62;

            // --- Base dark wires ---
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#1e293b';
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(leftX, topY); ctx.lineTo(rightX, topY);
            ctx.lineTo(rightX, botY); ctx.lineTo(leftX, botY);
            ctx.closePath();
            ctx.stroke();

            // Vertical parallel branch for Diode + Bias Source
            ctx.beginPath();
            ctx.moveTo(midX_diode, topY); ctx.lineTo(midX_diode, botY);
            ctx.stroke();

            // --- Soft Glow Active Highlights ---
            ctx.lineWidth = 4;
            ctx.shadowBlur = 4;

            // Input side (Soft Gold)
            ctx.strokeStyle = '#ffb020';
            ctx.shadowColor = '#ffb020';
            ctx.beginPath();
            ctx.moveTo(leftX, topY); ctx.lineTo(midX_cap - 20, topY);
            ctx.stroke();

            // Output side (Soft Cyan)
            ctx.strokeStyle = '#00d2d3';
            ctx.shadowColor = '#00d2d3';
            ctx.beginPath();
            ctx.moveTo(midX_cap + 20, topY); ctx.lineTo(rightX, topY);
            ctx.lineTo(rightX, botY);
            ctx.stroke();

            // Diode branch highlight (Soft Green if ON, Dark if OFF)
            ctx.strokeStyle = isDiodeON ? '#10ac84' : '#1e293b';
            ctx.shadowColor = isDiodeON ? '#10ac84' : 'transparent';
            ctx.beginPath();
            ctx.moveTo(midX_diode, topY); ctx.lineTo(midX_diode, botY);
            ctx.stroke();

            // Return ground rail (Soft Green)
            ctx.strokeStyle = '#10ac84';
            ctx.shadowColor = '#10ac84';
            ctx.beginPath();
            ctx.moveTo(rightX, botY); ctx.lineTo(leftX, botY);
            ctx.lineTo(leftX, topY);
            ctx.stroke();

            ctx.shadowBlur = 0;

            // Ground Symbol
            ctx.strokeStyle = '#10ac84';
            ctx.lineWidth = 2.5;
            const gx = midX_diode;
            ctx.beginPath();
            ctx.moveTo(gx, botY); ctx.lineTo(gx, botY + 16);
            ctx.moveTo(gx - 16, botY + 16); ctx.lineTo(gx + 16, botY + 16);
            ctx.moveTo(gx - 10, botY + 21); ctx.lineTo(gx + 10, botY + 21);
            ctx.moveTo(gx - 5,  botY + 26); ctx.lineTo(gx + 5,  botY + 26);
            ctx.stroke();

            // ===== COMPONENTS =====
            drawACSource(leftX, (topY + botY) / 2, vIn, t.srcName);
            drawCapacitor(midX_cap, topY, t.capName, Capacitance + ' µF');
            drawDiodeAndBias(midX_diode, (topY + botY) / 2, clamperType, isDiodeON, t.diodeName, t.vbiasName);
            drawLoad(rightX, (topY + botY) / 2, vOut, t.loadName, R_L + ' kΩ');
        }

        function drawACSource(x, y, vInst, name) {
            ctx.save();
            ctx.translate(x, y);

            ctx.shadowColor = '#ffb020';
            ctx.shadowBlur = 4;
            ctx.fillStyle = '#0f172a';
            ctx.strokeStyle = '#ffb020';
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.shadowBlur = 0;

            // Sine wave inside
            ctx.strokeStyle = '#ffe066';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-12, 0);
            ctx.bezierCurveTo(-6, -15, 6, 15, 12, 0);
            ctx.stroke();

            ctx.fillStyle = '#ffb020';
            ctx.font = 'bold 12px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText(vInst.toFixed(1) + ' V', 0, 44);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '12px Segoe UI';
            ctx.fillText(name, 0, -38);
            ctx.restore();
        }

        function drawCapacitor(x, y, name, val) {
            ctx.save();
            ctx.translate(x, y);

            ctx.strokeStyle = '#9b59b6';
            ctx.shadowColor = '#9b59b6';
            ctx.shadowBlur = 4;
            ctx.lineWidth = 3;

            // Vertical plates
            ctx.beginPath();
            ctx.moveTo(-8, -16); ctx.lineTo(-8, 16);
            ctx.moveTo(8, -16);  ctx.lineTo(8, 16);
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#e2e8f0';
            ctx.font = 'bold 12px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText(name, 0, -26);
            ctx.fillStyle = '#9b59b6';
            ctx.fillText(val, 0, 32);
            ctx.restore();
        }

        function drawDiodeAndBias(x, y, type, isON, dName, bName) {
            ctx.save();
            ctx.translate(x, y);

            const col = isON ? '#10ac84' : '#64748b';
            ctx.strokeStyle = col;
            ctx.fillStyle = '#0f172a';
            ctx.lineWidth = 2.5;

            if (isON) {
                ctx.shadowColor = col;
                ctx.shadowBlur = 5;
            }

            // Diode Symbol (Up for Positive Clamper, Down for Negative Clamper)
            const dir = type === 'positive' ? -1 : 1; // -1 points up, 1 points down
            ctx.save();
            ctx.scale(1, dir);

            // Triangle
            ctx.beginPath();
            ctx.moveTo(0, -16); ctx.lineTo(14, 14); ctx.lineTo(-14, 14);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            // Plate
            ctx.beginPath();
            ctx.moveTo(-14, -16); ctx.lineTo(14, -16);
            ctx.stroke();
            ctx.restore();

            // DC Bias Voltage Source below Diode
            ctx.shadowBlur = 0;
            ctx.translate(0, 50);
            ctx.strokeStyle = '#ffb020';
            ctx.lineWidth = 2.5;
            
            // Battery plates
            ctx.beginPath();
            ctx.moveTo(-14, -6); ctx.lineTo(14, -6); // Long (+)
            ctx.moveTo(-7, 6);  ctx.lineTo(7, 6);   // Short (-)
            ctx.stroke();

            ctx.fillStyle = '#e2e8f0';
            ctx.font = 'bold 12px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText(dName, 28, -50);
            ctx.fillStyle = '#ffb020';
            ctx.fillText(`${bName} (${V_bias}V)`, 38, 22);

            ctx.restore();
        }

        function drawLoad(x, y, vOut, name, val) {
            ctx.save();
            ctx.translate(x, y);

            ctx.shadowColor = '#00d2d3';
            ctx.shadowBlur = 4;

            ctx.fillStyle = '#0f172a';
            ctx.strokeStyle = '#00d2d3';
            ctx.lineWidth = 2.5;
            ctx.fillRect(-15, -28, 30, 56);
            ctx.strokeRect(-15, -28, 30, 56);
            ctx.shadowBlur = 0;

            ctx.strokeStyle = '#67e8f9';
            ctx.lineWidth = 1.8;
            for (let i = -16; i <= 16; i += 11) {
                ctx.beginPath();
                ctx.moveTo(-8, i); ctx.lineTo(8, i);
                ctx.stroke();
            }

            ctx.fillStyle = '#e2e8f0';
            ctx.font = 'bold 12px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText(name, 0, -38);
            ctx.fillStyle = '#00d2d3';
            ctx.fillText(val, 0, 48);
            ctx.restore();
        }

        function spawnParticle(path) {
            particles.push({
                path: path,
                progress: 0,
                speed: 0.015
            });
        }

        function updateParticles(isDiodeON) {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.progress += p.speed;
                let px, py, color;

                if (p.path === 'top') {
                    px = leftX + p.progress * (rightX - leftX);
                    py = topY;
                    color = px < midX_cap ? '#ffb020' : '#00d2d3';
                    if (p.progress >= 1) {
                        particles.splice(i, 1);
                        spawnParticle('load');
                        if (isDiodeON) spawnParticle('diode');
                        continue;
                    }
                } else if (p.path === 'diode') {
                    px = midX_diode;
                    py = topY + p.progress * (botY - topY);
                    color = '#10ac84';
                    if (p.progress >= 1) {
                        particles.splice(i, 1);
                        spawnParticle('bottom');
                        continue;
                    }
                } else if (p.path === 'load') {
                    px = rightX;
                    py = topY + p.progress * (botY - topY);
                    color = '#00d2d3';
                    if (p.progress >= 1) {
                        particles.splice(i, 1);
                        spawnParticle('bottom');
                        continue;
                    }
                } else if (p.path === 'bottom') {
                    px = rightX - p.progress * (rightX - leftX);
                    py = botY;
                    color = '#10ac84';
                    if (p.progress >= 1) {
                        particles.splice(i, 1);
                        continue;
                    }
                }

                ctx.beginPath();
                ctx.arc(px, py, 3.5, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.shadowColor = color;
                ctx.shadowBlur = 4;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function drawWaveScope() {
            const w = canvasWave.width;
            const h = canvasWave.height;
            ctxWave.clearRect(0, 0, w, h);

            // Grid
            ctxWave.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctxWave.lineWidth = 1;
            ctxWave.beginPath();
            for (let x = 0; x < w; x += 30) { ctxWave.moveTo(x, 0); ctxWave.lineTo(x, h); }
            for (let y = 0; y < h; y += 20) { ctxWave.moveTo(0, y); ctxWave.lineTo(w, y); }
            ctxWave.stroke();

            const yZero = h / 2;
            const scale = (h / 2 - 20) / 35; // Vertical scale for +/- 35V range

            // Ground Reference Zero Line
            ctxWave.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctxWave.setLineDash([4, 4]);
            ctxWave.beginPath(); ctxWave.moveTo(0, yZero); ctxWave.lineTo(w, yZero); ctxWave.stroke();
            ctxWave.setLineDash([]);

            // Bias Reference Line
            const yB = yZero - V_bias * scale;
            ctxWave.strokeStyle = 'rgba(255, 176, 32, 0.3)';
            ctxWave.beginPath(); ctxWave.moveTo(0, yB); ctxWave.lineTo(w, yB); ctxWave.stroke();

            const step = w / maxHistory;

            // Vin Waveform (Yellow)
            ctxWave.strokeStyle = '#ffb020';
            ctxWave.lineWidth = 1.8;
            ctxWave.beginPath();
            for (let i = 0; i < hist_Vin.length; i++) {
                const x = i * step;
                const y = yZero - hist_Vin[i] * scale;
                if (i === 0) ctxWave.moveTo(x, y); else ctxWave.lineTo(x, y);
            }
            ctxWave.stroke();

            // Vout Waveform (Cyan)
            ctxWave.strokeStyle = '#00d2d3';
            ctxWave.lineWidth = 2.2;
            ctxWave.beginPath();
            for (let i = 0; i < hist_Vout.length; i++) {
                const x = i * step;
                const y = yZero - hist_Vout[i] * scale;
                if (i === 0) ctxWave.moveTo(x, y); else ctxWave.lineTo(x, y);
            }
            ctxWave.stroke();

            ctxWave.font = 'bold 11px Segoe UI';
            ctxWave.textAlign = 'left';
            ctxWave.fillStyle = '#ffb020'; ctxWave.fillText('V_in (AC Original)', 10, 16);
            ctxWave.fillStyle = '#00d2d3'; ctxWave.fillText('V_out (Clamped Shifted)', 10, 32);
        }

        setLanguage(currentLang);
        requestAnimationFrame(animate);
    </script>
</body>
